<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Recycling arrows -->
  <g fill="#F0F0F0">
    <!-- Arrow 1: top-left curving right -->
    <path d="M18 28l8-10 4 3-5 6h10c4 0 7-3 7-7v-2h5v2c0 7-5 12-12 12H25l5 6-4 3z"/>
    <!-- Arrow 2: right curving down-left -->
    <path d="M48 32l-3 12-4-2 2-7-5 9c-2 3-6 5-10 4l-2-1 2-4 2 1c3 0 5-1 6-4l5-8-7 2-2-4z"/>
    <!-- Arrow 3: bottom curving up -->
    <path d="M16 48l-5-2 3-7-5 1c-3 2-5 5-4 9l1 2-5 2-1-2c-2-6 1-12 7-15l6-2-4-5 4-3z"/>
  </g>
  <!-- "WES'" text -->
  <text x="62" y="38" font-family="Arial Black, Anton, sans-serif" font-weight="900" font-size="38" fill="#F0F0F0" letter-spacing="-1">WES'</text>
  <!-- Horizontal divider line -->
  <rect x="60" y="42" width="120" height="3" fill="#F0F0F0"/>
  <!-- "recycling" text -->
  <text x="62" y="68" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="30" fill="#F0F0F0" letter-spacing="0">recycling</text>
</svg>
