<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wes' Recycling — Linn County's trusted scrap metal recycler with two locations in Centerville and Prescott, Kansas. Fair prices, cash on the spot.">
  <meta name="theme-color" content="#0A0A0A">
  <title>Wes' Recycling | Scrap Metal Recycling in Linn County, KS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ───────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    ul, ol { list-style: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    img, svg { display: block; max-width: 100%; }

    /* ── Variables ────────────────────────────────────────── */
    :root {
      --bg: #0A0A0A;
      --surface: #141414;
      --text: #F0F0F0;
      --text-secondary: rgba(255,255,255,0.55);
      --accent: #4A6FA5;
      --accent-hover: #5D85BD;
      --warm: #D4A84B;
      --border: rgba(255,255,255,0.08);
      --nav-height: 72px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    /* ── Nav ──────────────────────────────────────────────── */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-height);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 56px);
      background: rgba(10, 10, 10, 0);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      border-bottom: 1px solid transparent;
      transition: background 0.4s, backdrop-filter 0.4s, border-color 0.4s;
    }

    .nav.scrolled {
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom-color: var(--border);
    }

    .nav__logo {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(22px, 2.4vw, 30px);
      letter-spacing: 0.04em;
      color: var(--text);
      white-space: nowrap;
    }

    .nav__links {
      display: flex;
      align-items: center;
      gap: clamp(20px, 2.5vw, 36px);
    }

    .nav__link {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      transition: color 0.25s;
      white-space: nowrap;
    }

    .nav__link:hover {
      color: var(--text);
    }

    .nav__cta {
      display: inline-flex;
      align-items: center;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border-radius: 6px;
      transition: background 0.25s, transform 0.2s;
      white-space: nowrap;
    }

    .nav__cta:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Hamburger */
    .nav__hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 28px;
      height: 28px;
      position: relative;
      z-index: 1001;
    }

    .nav__hamburger span {
      display: block;
      width: 100%;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: transform 0.3s, opacity 0.3s;
      transform-origin: center;
    }

    .nav__hamburger.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .nav__hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .nav__hamburger.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Mobile menu */
    .nav__mobile {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .nav__mobile.open {
      display: flex;
      opacity: 1;
    }

    .nav__mobile a {
      font-family: 'Bebas Neue', cursive;
      font-size: 32px;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      transition: color 0.25s;
    }

    .nav__mobile a:hover {
      color: var(--text);
    }

    .nav__mobile .nav__cta {
      margin-top: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      padding: 14px 32px;
    }

    /* ── Hero ─────────────────────────────────────────────── */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero__bg {
      position: absolute;
      inset: 0;
      background-image: url('IMG_6795.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(10, 10, 10, 0.85) 0%,
        rgba(10, 10, 10, 0.6) 40%,
        rgba(10, 10, 10, 0.7) 100%
      );
      z-index: 1;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      padding: 0 clamp(20px, 6vw, 80px);
      max-width: 820px;
      padding-top: var(--nav-height);
    }

    .hero__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--warm);
      opacity: 0.85;
      margin-bottom: 20px;
    }

    .hero__eyebrow::before {
      content: '';
      display: inline-block;
      width: 28px;
      height: 1px;
      background: var(--warm);
    }

    .hero__headline {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(42px, 7vw, 96px);
      line-height: 0.95;
      letter-spacing: 0.02em;
      color: var(--text);
      margin-bottom: 20px;
    }

    .hero__sub {
      font-weight: 300;
      font-size: clamp(16px, 1.8vw, 22px);
      color: var(--text-secondary);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .hero__buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 32px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.2s;
      white-space: nowrap;
    }

    .btn--filled {
      background: var(--accent);
      color: #fff;
    }

    .btn--filled:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn--ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn--ghost:hover {
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }

    /* Scroll indicator */
    .hero__scroll {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hero__scroll__chevron {
      width: 20px;
      height: 20px;
      border-right: 1.5px solid var(--text-secondary);
      border-bottom: 1.5px solid var(--text-secondary);
      transform: rotate(45deg);
      animation: scrollBounce 2s ease-in-out infinite;
    }

    @keyframes scrollBounce {
      0%, 100% { transform: rotate(45deg) translateY(0); opacity: 0.6; }
      50%      { transform: rotate(45deg) translateY(6px); opacity: 1; }
    }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 640px) {
      .nav__links {
        display: none;
      }

      .nav__hamburger {
        display: flex;
      }

      .hero__content {
        padding-top: calc(var(--nav-height) + 24px);
      }

      .hero__buttons {
        flex-direction: column;
        width: 100%;
      }

      .btn {
        width: 100%;
        text-align: center;
      }

      .hero__scroll {
        bottom: 20px;
      }
    }

    @media (max-width: 393px) {
      :root {
        --nav-height: 60px;
      }

      .nav {
        padding: 0 16px;
      }

      .hero__content {
        padding: calc(var(--nav-height) + 16px) 16px 0;
      }

      .hero__eyebrow {
        font-size: 10px;
      }

      .hero__sub {
        font-size: 15px;
      }

      .btn {
        padding: 14px 20px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- ── NAV ──────────────────────────────────────────── -->
  <nav class="nav" id="nav">
    <a href="#" class="nav__logo">Wes' Recycling</a>

    <div class="nav__links">
      <a href="#what-we-buy" class="nav__link">What We Buy</a>
      <a href="#pricing" class="nav__link">Pricing</a>
      <a href="#locations" class="nav__link">Locations</a>
      <a href="#services" class="nav__link">Services</a>
      <a href="#contact" class="nav__cta">Contact Us</a>
    </div>

    <button class="nav__hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile overlay -->
  <div class="nav__mobile" id="mobileMenu">
    <a href="#what-we-buy">What We Buy</a>
    <a href="#pricing">Pricing</a>
    <a href="#locations">Locations</a>
    <a href="#services">Services</a>
    <a href="#contact" class="nav__cta">Contact Us</a>
  </div>

  <!-- ── HERO ─────────────────────────────────────────── -->
  <section class="hero" id="hero">
    <div class="hero__bg"></div>
    <div class="hero__overlay"></div>

    <div class="hero__content">
      <div class="hero__eyebrow">Centerville &amp; Prescott, Kansas</div>
      <h1 class="hero__headline">Linn County's Scrap<br>Metal Recycler</h1>
      <p class="hero__sub">Two locations. Fair prices. Cash on the spot.</p>
      <div class="hero__buttons">
        <a href="#pricing" class="btn btn--filled">View Current Pricing</a>
        <a href="#locations" class="btn btn--ghost">Get Directions</a>
      </div>
    </div>

    <div class="hero__scroll">
      <span>Scroll</span>
      <div class="hero__scroll__chevron"></div>
    </div>
  </section>

  <script>
    /* ── Mobile menu toggle ─────────────────────────────── */
    (function () {
      var hamburger = document.getElementById('hamburger');
      var mobileMenu = document.getElementById('mobileMenu');
      var body = document.body;

      hamburger.addEventListener('click', function () {
        hamburger.classList.toggle('active');
        mobileMenu.classList.toggle('open');
        body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
      });

      /* Close menu when a link is tapped */
      mobileMenu.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          hamburger.classList.remove('active');
          mobileMenu.classList.remove('open');
          body.style.overflow = '';
        });
      });

      /* ── Nav scroll effect ──────────────────────────────── */
      var nav = document.getElementById('nav');
      var scrolled = false;

      window.addEventListener('scroll', function () {
        if (window.scrollY > 40 && !scrolled) {
          nav.classList.add('scrolled');
          scrolled = true;
        } else if (window.scrollY <= 40 && scrolled) {
          nav.classList.remove('scrolled');
          scrolled = false;
        }
      }, { passive: true });
    })();
  </script>

</body>
</html>
